<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff8787"/>
    </linearGradient>
  </defs>
  <!-- Book cover base -->
  <rect width="300" height="400" rx="8" fill="url(#bg)"/>
  <!-- Spine accent -->
  <rect x="0" y="0" width="12" height="400" rx="4" fill="url(#spine)"/>
  <!-- Inner border/frame -->
  <rect x="24" y="24" width="252" height="352" rx="4" fill="none" stroke="#2a2a4a" stroke-width="1.5"/>
  <!-- Decorative top ornament -->
  <g transform="translate(150,70)" opacity="0.3">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#ff6b6b" stroke-width="1"/>
    <circle cx="-40" cy="0" r="3" fill="#ff6b6b"/>
    <circle cx="0" cy="0" r="4" fill="#ff6b6b"/>
    <circle cx="40" cy="0" r="3" fill="#ff6b6b"/>
  </g>
  <!-- Title area -->
  <rect x="54" y="110" width="192" height="60" rx="4" fill="#2a2a4a" opacity="0.5"/>
  <!-- Title text lines -->
  <rect x="74" y="118" width="152" height="6" rx="3" fill="#8892b0" opacity="0.4"/>
  <rect x="74" y="132" width="120" height="6" rx="3" fill="#8892b0" opacity="0.3"/>
  <rect x="74" y="146" width="80" height="6" rx="3" fill="#8892b0" opacity="0.3"/>
  <!-- Author area -->
  <rect x="90" y="200" width="120" height="4" rx="2" fill="#8892b0" opacity="0.2"/>
  <!-- Decorative divider -->
  <line x1="100" y1="230" x2="200" y2="230" stroke="#2a2a4a" stroke-width="1"/>
  <!-- Cover art abstract shapes -->
  <g opacity="0.08">
    <circle cx="120" cy="290" r="50" fill="#ff6b6b"/>
    <circle cx="210" cy="270" r="35" fill="#4ecdc4"/>
    <circle cx="180" cy="340" r="40" fill="#ffb347"/>
  </g>
  <!-- Bottom accent bar -->
  <rect x="24" y="370" width="252" height="2" fill="#ff6b6b" opacity="0.3"/>
  <!-- Language badge (bottom-left) -->
  <rect x="28" y="338" width="36" height="18" rx="4" fill="#4ecdc4" opacity="0.15"/>
  <text x="46" y="350" text-anchor="middle" fill="#4ecdc4" font-size="9" font-family="sans-serif">ລາວ</text>
</svg>
