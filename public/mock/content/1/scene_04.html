<!DOCTYPE html>
<html lang="lo">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#0f0f23;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Lao',sans-serif}
  .panel{width:100%;max-width:480px;aspect-ratio:3/4;border:3px solid #2a2a4a;border-radius:16px;overflow:hidden;position:relative;background:#0a1628}
  .panel::after{content:'';position:absolute;inset:6px;border:2px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
  svg{width:100%;height:100%;display:block}
</style></head>
<body><div class="panel"><svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a3e"/><stop offset="40%" stop-color="#2a2a5e"/><stop offset="100%" stop-color="#4a6fa5"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a4a7f"/><stop offset="100%" stop-color="#1a3050"/></linearGradient>
  </defs>
  <!-- Storm sky -->
  <rect width="480" height="280" fill="url(#storm)"/>
  <!-- Storm clouds -->
  <g fill="#1a1a3e" opacity="0.8">
    <ellipse cx="80" cy="80" rx="70" ry="30"/><ellipse cx="140" cy="65" rx="60" ry="35"/>
    <ellipse cx="300" cy="90" rx="55" ry="28"/><ellipse cx="360" cy="70" rx="65" ry="32"/>
    <ellipse cx="420" cy="100" rx="50" ry="25"/><ellipse cx="200" cy="55" rx="45" ry="22"/>
  </g>
  <!-- Lightning -->
  <g stroke="#ffeaa7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M180,10 L165,50 L185,55 L160,100"/>
    <path d="M178,14 L163,48 L183,53 L162,96" stroke-width="3" opacity="0.4"/>
  </g>
  <!-- Mountains -->
  <polygon points="0,260 60,180 120,230 200,160 260,220 340,170 420,210 480,180 480,300 0,300" fill="#1e2a3a"/>
  <polygon points="0,280 80,220 150,260 240,210 320,255 400,230 480,260 480,300 0,300" fill="#162030"/>
  <!-- River -->
  <rect y="300" width="480" height="280" fill="url(#water)"/>
  <!-- Water ripples -->
  <g stroke="#4a7ab5" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M20,330 Q50,325 80,330 Q110,335 140,330 Q170,325 200,330"/>
    <path d="M260,350 Q290,345 320,350 Q350,355 380,350 Q410,345 440,350 Q460,355 480,350"/>
    <path d="M40,400 Q80,394 120,400 Q160,406 200,400 Q240,394 280,400"/>
    <path d="M300,420 Q340,414 380,420 Q420,426 460,420"/>
    <path d="M10,460 Q60,454 110,460 Q160,466 210,460 Q260,454 310,460"/>
  </g>
  <!-- River rocks -->
  <g fill="#2a3a4a">
    <ellipse cx="120" cy="370" rx="14" ry="10"/><ellipse cx="380" cy="440" rx="18" ry="12"/>
    <ellipse cx="200" cy="480" rx="10" ry="7"/><ellipse cx="340" cy="340" rx="12" ry="8"/>
  </g>
  <!-- Buffalo crossing river -->
  <g transform="translate(140,340)">
    <!-- Water splashes around legs -->
    <g fill="#4a7ab5" opacity="0.4">
      <ellipse cx="6" cy="72" rx="14" ry="5"/><ellipse cx="30" cy="74" rx="15" ry="5"/>
      <ellipse cx="64" cy="75" rx="16" ry="5"/><ellipse cx="88" cy="76" rx="14" ry="5"/>
    </g>
    <!-- Body partially submerged -->
    <ellipse cx="52" cy="45" rx="55" ry="22" fill="#3e2723"/>
    <ellipse cx="18" cy="30" rx="16" ry="12" fill="#4e3629"/>
    <circle cx="72" cy="30" r="3.5" fill="#1a1008"/>
    <!-- Head above water -->
    <ellipse cx="18" cy="22" rx="17" ry="13" fill="#4e3629"/>
    <!-- Horns -->
    <path d="M10,4 Q2,-12 8,-24" stroke="#2e1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M28,4 Q33,-10 39,-20" stroke="#2e1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Boy figure on buffalo -->
  <g transform="translate(210,300)">
    <circle cx="0" cy="-8" r="7" fill="#d4a056"/>
    <line x1="0" y1="-1" x2="0" y2="16" stroke="#e07050" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="-10" y2="10" stroke="#e07050" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="10" y2="12" stroke="#e07050" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="-5" y2="28" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="6" y2="28" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Caption -->
  <g transform="translate(30,530)">
    <rect x="0" y="0" width="420" height="65" rx="10" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1.5" opacity="0.9"/>
    <text x="210" y="24" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">ຂ້າມແມ່ນ້ຳ</text>
    <text x="210" y="46" text-anchor="middle" fill="#8892b0" font-size="10">Crossing the great river</text>
  </g>
  <text x="20" y="120" fill="#ff6b6b" font-size="10" font-weight="700" opacity="0.5">PANEL 4</text>
</svg></div></body>
</html>
