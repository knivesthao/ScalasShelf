<!DOCTYPE html>
<html lang="lo">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#0f0f23;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Lao',sans-serif}
  .panel{width:100%;max-width:480px;aspect-ratio:3/4;border:3px solid #2a2a4a;border-radius:16px;overflow:hidden;position:relative;background:#0a1628}
  .panel::after{content:'';position:absolute;inset:6px;border:2px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
  svg{width:100%;height:100%;display:block}
</style></head>
<body><div class="panel"><svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyset" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b3d"/><stop offset="30%" stop-color="#ff8855"/><stop offset="60%" stop-color="#ffb088"/><stop offset="100%" stop-color="#ffe0b0"/></linearGradient>
  </defs>
  <!-- Sunset sky -->
  <rect width="480" height="280" fill="url(#skyset)"/>
  <circle cx="240" cy="240" r="80" fill="#ffeaa7" opacity="0.9"/>
  <circle cx="240" cy="240" r="50" fill="#fff5d0"/>
  <!-- Temple silhouette -->
  <g fill="#2d1810" opacity="0.85">
    <rect x="160" y="100" width="160" height="180" rx="4"/>
    <rect x="140" y="120" width="200" height="160" rx="3"/>
    <!-- Roof tiers -->
    <polygon points="240,30 120,130 360,130"/>
    <polygon points="240,60 140,140 340,140"/>
    <polygon points="240,90 155,150 325,150"/>
    <!-- Spire -->
    <rect x="237" y="10" width="6" height="30" rx="2"/>
    <circle cx="240" cy="10" r="6"/>
    <!-- Door -->
    <rect x="215" y="220" width="50" height="60" rx="3" fill="#1a0e08"/>
    <!-- Window -->
    <rect x="185" y="160" width="20" height="30" rx="2" fill="#1a0e08"/>
    <rect x="275" y="160" width="20" height="30" rx="2" fill="#1a0e08"/>
    <rect x="225" y="140" width="30" height="20" rx="2" fill="#1a0e08"/>
  </g>
  <!-- Ground -->
  <rect y="280" width="480" height="360" fill="#3e2a1a"/>
  <rect y="280" width="480" height="8" fill="#5a3a24" opacity="0.5"/>
  <!-- Trees -->
  <g opacity="0.6">
    <rect x="60" y="200" width="8" height="80" fill="#2d1810"/>
    <ellipse cx="64" cy="185" rx="28" ry="35" fill="#2d5016"/>
    <ellipse cx="80" cy="200" rx="18" ry="25" fill="#3a6820"/>
    <rect x="400" y="210" width="7" height="70" fill="#2d1810"/>
    <ellipse cx="403" cy="195" rx="25" ry="32" fill="#2d5016"/>
    <ellipse cx="390" cy="210" rx="16" ry="22" fill="#3a6820"/>
  </g>
  <!-- Market stalls -->
  <g transform="translate(60,380)">
    <rect x="0" y="0" width="120" height="60" rx="4" fill="#5a3a24"/>
    <rect x="0" y="0" width="120" height="8" rx="2" fill="#8B6914"/>
    <polygon points="-5,0 60,-30 125,0" fill="#d4953a"/>
    <!-- Wares -->
    <circle cx="20" cy="25" r="8" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="45" cy="22" r="9" fill="#ffb347" opacity="0.7"/>
    <circle cx="70" cy="26" r="7" fill="#4ecdc4" opacity="0.7"/>
    <circle cx="95" cy="23" r="8" fill="#ffeaa7" opacity="0.7"/>
  </g>
  <g transform="translate(280,390)">
    <rect x="0" y="0" width="100" height="50" rx="4" fill="#5a3a24"/>
    <rect x="0" y="0" width="100" height="7" rx="2" fill="#8B6914"/>
    <polygon points="-4,0 50,-25 104,0" fill="#c48a2e"/>
    <rect x="12" y="18" width="18" height="25" rx="2" fill="#e07050" opacity="0.6"/>
    <rect x="38" y="16" width="18" height="27" rx="2" fill="#d4953a" opacity="0.6"/>
    <rect x="64" y="20" width="18" height="22" rx="2" fill="#4ecdc4" opacity="0.6"/>
  </g>
  <!-- Foreground ground texture -->
  <g stroke="#5a3a24" stroke-width="1" opacity="0.3">
    <line x1="20" y1="500" x2="80" y2="500"/><line x1="150" y1="520" x2="220" y2="520"/>
    <line x1="300" y1="510" x2="370" y2="510"/><line x1="100" y1="550" x2="190" y2="550"/>
  </g>
  <!-- Caption box -->
  <g transform="translate(30,540)">
    <rect x="0" y="0" width="420" height="55" rx="10" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="1.5" opacity="0.9"/>
    <text x="210" y="24" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">ຕະຫຼາດເຊົ້າທີ່ຫຼວງພະບາງ</text>
    <text x="210" y="44" text-anchor="middle" fill="#8892b0" font-size="10">Morning market in Luang Prabang</text>
  </g>
  <text x="20" y="130" fill="#ff6b6b" font-size="10" font-weight="700" opacity="0.5">PANEL 3</text>
</svg></div></body>
</html>
