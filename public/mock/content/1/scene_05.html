<!DOCTYPE html>
<html lang="lo">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#0f0f23;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Lao',sans-serif}
  .panel{width:100%;max-width:480px;aspect-ratio:3/4;border:3px solid #2a2a4a;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(180deg,#1a1040 0%,#3d1571 25%,#ff5e3a 55%,#ffb347 80%,#2d5016 100%)}
  .panel::after{content:'';position:absolute;inset:6px;border:2px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
  svg{width:100%;height:100%;display:block}
</style></head>
<body><div class="panel"><svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1040"/><stop offset="25%" stop-color="#3d1571"/><stop offset="55%" stop-color="#ff5e3a"/><stop offset="80%" stop-color="#ffb347"/><stop offset="100%" stop-color="#2d5016"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.68" r="0.25"><stop offset="0%" stop-color="#ffeaa7"/><stop offset="50%" stop-color="#ffb347" stop-opacity="0.6"/><stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="480" height="640" fill="url(#dusk)"/>
  <circle cx="240" cy="430" r="150" fill="url(#glow)"/>
  <!-- Stars -->
  <g fill="#ffeaa7" opacity="0.7">
    <circle cx="60" cy="40" r="1.5"/><circle cx="150" cy="28" r="1"/><circle cx="90" cy="70" r="1.2"/>
    <circle cx="320" cy="35" r="1.5"/><circle cx="400" cy="55" r="1"/><circle cx="440" cy="25" r="1.3"/>
    <circle cx="280" cy="60" r="0.8"/><circle cx="30" cy="90" r="1"/><circle cx="370" cy="22" r="1"/>
    <circle cx="200" cy="45" r="1.2"/><circle cx="460" cy="70" r="0.8"/>
  </g>
  <!-- Distant hills -->
  <polygon points="0,320 80,270 160,300 240,260 320,290 400,265 480,300 480,350 0,350" fill="#2d5016" opacity="0.5"/>
  <!-- Grassy ground -->
  <rect y="350" width="480" height="290" fill="#2d5016"/>
  <ellipse cx="240" cy="350" rx="300" ry="30" fill="#3a6e1e" opacity="0.4"/>
  <!-- Grass tufts -->
  <g stroke="#4a8e2e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M80,370 Q78,355 82,342"/><path d="M85,370 Q86,352 90,338"/>
    <path d="M200,380 Q198,365 202,350"/><path d="M206,380 Q208,360 212,348"/>
    <path d="M350,375 Q348,360 352,345"/><path d="M356,375 Q358,358 362,343"/>
    <path d="M420,385 Q418,372 422,358"/><path d="M425,385 Q428,368 432,354"/>
  </g>
  <!-- Buffalo resting -->
  <g transform="translate(120,400)">
    <ellipse cx="55" cy="30" rx="60" ry="32" fill="#3e2723"/>
    <ellipse cx="18" cy="18" rx="18" ry="14" fill="#4e3629"/>
    <circle cx="74" cy="14" r="4" fill="#1a1008"/>
    <rect x="6" y="62" width="10" height="30" rx="3" fill="#3e2723"/>
    <rect x="30" y="62" width="10" height="30" rx="3" fill="#3e2723"/>
    <rect x="66" y="62" width="10" height="30" rx="3" fill="#3e2723"/>
    <rect x="90" y="62" width="10" height="30" rx="3" fill="#3e2723"/>
    <path d="M12,4 Q0,-12 8,-24" stroke="#2e1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M30,4 Q35,-10 41,-20" stroke="#2e1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Boy sitting beside buffalo -->
  <g transform="translate(260,440)">
    <circle cx="0" cy="-10" r="7" fill="#d4a056"/>
    <line x1="0" y1="-3" x2="0" y2="14" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="-8" y2="14" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="-8" y2="28" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="8" y2="26" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Fireflies -->
  <g fill="#ffeaa7" opacity="0.8">
    <circle cx="340" cy="340" r="3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="360" r="2.5"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="370" r="2.5"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="380" r="2"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <!-- End narration box -->
  <g transform="translate(30,510)">
    <rect x="0" y="0" width="420" height="85" rx="12" fill="#1a1a2e" stroke="#ffb347" stroke-width="2" opacity="0.9"/>
    <text x="210" y="26" text-anchor="middle" fill="#ffb347" font-size="16" font-weight="700">ຈົບ</text>
    <text x="210" y="50" text-anchor="middle" fill="#8892b0" font-size="11">ຂອບໃຈທີ່ຕິດຕາມ</text>
    <text x="210" y="70" text-anchor="middle" fill="#8892b0" font-size="10" opacity="0.6">— The End —</text>
  </g>
  <text x="20" y="100" fill="#ff6b6b" font-size="10" font-weight="700" opacity="0.5">PANEL 5</text>
</svg></div></body>
</html>
