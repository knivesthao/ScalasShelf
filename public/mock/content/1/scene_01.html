<!DOCTYPE html>
<html lang="lo">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#0f0f23;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Lao',sans-serif}
  .panel{width:100%;max-width:480px;aspect-ratio:3/4;border:3px solid #2a2a4a;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(180deg,#1a1040 0%,#2d1b69 40%,#ff6b3d 70%,#ffb347 100%)}
  .panel::after{content:'';position:absolute;inset:6px;border:2px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
  svg{width:100%;height:100%;display:block}
</style></head>
<body><div class="panel"><svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1040"/><stop offset="40%" stop-color="#2d1b69"/><stop offset="70%" stop-color="#ff6b3d"/><stop offset="100%" stop-color="#ffb347"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.7" r="0.3"><stop offset="0%" stop-color="#ffeaa7"/><stop offset="60%" stop-color="#ff6b3d" stop-opacity="0.8"/><stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="480" height="640" fill="url(#sky)"/>
  <circle cx="240" cy="400" r="180" fill="url(#sun)"/>
  <!-- Mountains -->
  <polygon points="0,440 80,280 160,380 240,300 320,370 400,260 480,420 480,640 0,640" fill="#1a1040" opacity="0.9"/>
  <polygon points="0,480 120,360 200,420 280,380 380,430 480,370 480,640 0,640" fill="#0f0f23"/>
  <!-- Buffalo silhouette -->
  <g transform="translate(190,420)" fill="#0a0a1a">
    <ellipse cx="50" cy="30" rx="55" ry="28"/>
    <ellipse cx="18" cy="10" rx="18" ry="12"/>
    <circle cx="75" cy="12" r="5"/>
    <rect x="0" y="55" width="8" height="30" rx="3"/>
    <rect x="24" y="55" width="8" height="30" rx="3"/>
    <rect x="62" y="55" width="8" height="30" rx="3"/>
    <rect x="86" y="55" width="8" height="30" rx="3"/>
    <!-- Horns -->
    <path d="M10,2 Q0,-10 5,-18" stroke="#0a0a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M28,2 Q30,-12 35,-18" stroke="#0a0a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Birds -->
  <g stroke="#1a1040" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M120,120 Q130,112 140,120 Q150,112 160,120"/>
    <path d="M300,100 Q308,93 316,100 Q324,93 332,100"/>
    <path d="M360,140 Q366,134 372,140 Q378,134 384,140"/>
  </g>
  <!-- Title -->
  <text x="240" y="180" text-anchor="middle" fill="#ffeaa7" font-size="28" font-weight="800" letter-spacing="3" font-family="Georgia,serif">THE BRAVE</text>
  <text x="240" y="220" text-anchor="middle" fill="#ffb347" font-size="32" font-weight="800" letter-spacing="4" font-family="Georgia,serif">BUFFALO</text>
  <line x1="140" y1="235" x2="340" y2="235" stroke="#ffb347" stroke-width="1.5" opacity="0.6"/>
  <text x="240" y="265" text-anchor="middle" fill="#ffeaa7" font-size="16" opacity="0.8">ຄວາຍຜູ້ກ້າຫານ</text>
  <text x="240" y="295" text-anchor="middle" fill="#ffb347" font-size="12" opacity="0.6" letter-spacing="2">A LAO FOLK TALE</text>
  <!-- Scene number -->
  <circle cx="240" cy="590" r="16" fill="none" stroke="#ffb347" stroke-width="1.5" opacity="0.5"/>
  <text x="240" y="596" text-anchor="middle" fill="#ffb347" font-size="14" font-weight="700" opacity="0.7">1</text>
</svg></div></body>
</html>
