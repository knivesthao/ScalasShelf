<!DOCTYPE html>
<html lang="lo">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#0f0f23;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Lao',sans-serif}
  .panel{width:100%;max-width:480px;aspect-ratio:3/4;border:3px solid #2a2a4a;border-radius:16px;overflow:hidden;position:relative;background:#0a1628}
  .panel::after{content:'';position:absolute;inset:6px;border:2px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
  svg{width:100%;height:100%;display:block}
</style></head>
<body><div class="panel"><svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#87CEEB"/><stop offset="50%" stop-color="#b8d4e3"/><stop offset="100%" stop-color="#e8f0c8"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6b8e23"/><stop offset="100%" stop-color="#4a7c1e"/></linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="480" height="300" fill="url(#sky2)"/>
  <!-- Clouds -->
  <g fill="white" opacity="0.7">
    <ellipse cx="120" cy="80" rx="50" ry="18"/><ellipse cx="150" cy="72" rx="35" ry="15"/><ellipse cx="95" cy="76" rx="30" ry="12"/>
    <ellipse cx="380" cy="110" rx="45" ry="16"/><ellipse cx="350" cy="102" rx="30" ry="12"/>
  </g>
  <!-- Sun -->
  <circle cx="380" cy="70" r="40" fill="#ffeaa7" opacity="0.9"/>
  <!-- Mountains distant -->
  <polygon points="0,280 100,200 180,240 260,190 340,230 420,180 480,250 480,300 0,300" fill="#7eb87e" opacity="0.5"/>
  <!-- Rice fields -->
  <rect y="300" width="480" height="340" fill="url(#field)"/>
  <!-- Field rows -->
  <g stroke="#5a9a18" stroke-width="2" opacity="0.4">
    <line x1="0" y1="340" x2="480" y2="340"/><line x1="0" y1="370" x2="480" y2="370"/>
    <line x1="0" y1="400" x2="480" y2="400"/><line x1="0" y1="430" x2="480" y2="430"/>
    <line x1="0" y1="460" x2="480" y2="460"/><line x1="0" y1="490" x2="480" y2="490"/>
    <line x1="0" y1="520" x2="480" y2="520"/>
  </g>
  <!-- Rice stalks -->
  <g stroke="#8fbc3e" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M60,320 Q55,290 58,260"/><path d="M80,320 Q77,285 82,255"/>
    <path d="M160,340 Q155,310 158,280"/><path d="M185,340 Q180,308 184,275"/>
    <path d="M300,330 Q294,298 298,268"/><path d="M325,330 Q320,295 324,262"/>
    <path d="M400,335 Q396,302 400,272"/><path d="M430,335 Q426,300 430,268"/>
  </g>
  <!-- Buffalo in field -->
  <g transform="translate(150,420)">
    <ellipse cx="50" cy="30" rx="55" ry="30" fill="#3e2723"/>
    <ellipse cx="16" cy="12" rx="16" ry="14" fill="#4e3629"/>
    <circle cx="72" cy="14" r="4" fill="#1a1008"/>
    <!-- Legs -->
    <rect x="4" y="58" width="9" height="35" rx="3" fill="#3e2723"/>
    <rect x="28" y="58" width="9" height="35" rx="3" fill="#3e2723"/>
    <rect x="60" y="58" width="9" height="35" rx="3" fill="#3e2723"/>
    <rect x="84" y="58" width="9" height="35" rx="3" fill="#3e2723"/>
    <!-- Horns -->
    <path d="M10,4 Q0,-10 6,-22" stroke="#2e1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M27,4 Q31,-12 37,-22" stroke="#2e1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Farmer figure -->
  <g transform="translate(310,350)">
    <circle cx="8" cy="-15" r="8" fill="#d4a056"/><!-- head -->
    <line x1="8" y1="-7" x2="8" y2="16" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/><!-- body -->
    <line x1="8" y1="0" x2="-6" y2="10" stroke="#8B4513" stroke-width="3.5" stroke-linecap="round"/><!-- arm -->
    <line x1="8" y1="0" x2="22" y2="6" stroke="#8B4513" stroke-width="3.5" stroke-linecap="round"/><!-- arm -->
    <line x1="8" y1="16" x2="0" y2="35" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="16" x2="16" y2="35" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <!-- Hat -->
    <ellipse cx="8" cy="-23" rx="14" ry="4" fill="#d4953a"/>
    <path d="M0,-23 Q8,-33 16,-23" fill="#d4953a"/>
  </g>
  <!-- Dialog bubble -->
  <g transform="translate(50,440)">
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="2"/>
    <polygon points="35,70 45,88 55,70" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="2"/>
    <text x="110" y="28" text-anchor="middle" fill="#e4e4e4" font-size="13" font-weight="600">ນີ້ແມ່ນທົ່ງນາ</text>
    <text x="110" y="50" text-anchor="middle" fill="#8892b0" font-size="11">The rice fields at dawn</text>
  </g>
  <text x="20" y="580" fill="#ff6b6b" font-size="10" font-weight="700" opacity="0.5">PANEL 2</text>
</svg></div></body>
</html>
