services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npx vite --host 0.0.0.0 --port 5173

  test:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CI=true
    command: npx vitest run --exclude src/e2e

  test-e2e:
    build:
      context: .
      target: dev
    depends_on:
      - dev
    environment:
      - CI=true
    command: npx playwright test
